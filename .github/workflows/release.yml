# Release workflow for NOVA Planner.
#
# - Manual runs (Actions tab -> Release -> "Run workflow") build the Windows,
#   macOS and Linux installers and attach them as downloadable artifacts to
#   the workflow run. They are kept for 90 days by default.
# - Pushing a tag that matches "v*" (for example `v0.1.0`) runs the same
#   builds and additionally creates a GitHub Release with the installer
#   files attached.
#
# The app icons under src-tauri/icons are not stored in this repository;
# every job regenerates them from src/assets/logo-light.svg (`npm run icons`)
# before building. All installers are unsigned.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.artifact-name }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            artifact-name: windows
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            artifact-name: macos
            rust-targets: "x86_64-apple-darwin,aarch64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            artifact-name: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Generate app icons
        run: npm run icons

      - name: Build Tauri app
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Upload bundles as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-planner-${{ matrix.artifact-name }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          body: |
            NOVA Planner installers for Windows, macOS and Linux.

            These builds are **unsigned**. Windows SmartScreen and macOS
            Gatekeeper will warn on first launch — see `docs/INSTALL.md`
            in the repository for the exact steps to open the app anyway.
